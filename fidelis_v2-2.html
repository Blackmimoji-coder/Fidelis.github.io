/* =====================================================================

function kes(n) { return 'KES ' + (Number(n)||0).toLocaleString(); }

/* Returns the CDN storage URL only - no base64 fallback */
function gSrc(g) {
  return (g && (g.storageUrl || g.storage_url)) || '';
}

/* Compress + resize an image file before upload (max 1200px, quality 0.82) */
function compressImage(file, callback) {
  var maxPx = 1200;
  var quality = 0.82;
  var img = new Image();
  var url = URL.createObjectURL(file);
  img.onload = function() {
    URL.revokeObjectURL(url);
    var w = img.width, h = img.height;
    if (w <= maxPx && h <= maxPx) {
      /* Already small enough - read as-is */
      var r = new FileReader();
      r.onload = function(e){ callback(null, e.target.result, file); };
      r.readAsDataURL(file);
      return;
    }
    /* Scale down */
    var ratio = Math.min(maxPx / w, maxPx / h);
    var canvas = document.createElement('canvas');
    canvas.width  = Math.round(w * ratio);
    canvas.height = Math.round(h * ratio);
    var ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    var dataUrl = canvas.toDataURL('image/jpeg', quality);
    callback(null, dataUrl, file);
  };
  img.onerror = function() {
    /* Fall back to reading original */
    var r = new FileReader();
    r.onload = function(e){ callback(null, e.target.result, file); };
    r.readAsDataURL(file);
  };
  img.src = url;
}

/* Upload a file to Supabase Storage bucket 'gallery' and return public URL */
function uploadToStorage(file, dataUrl, callback) {
  if (!db) { callback(null, dataUrl); return; }
  /* Attempt Storage upload using the Supabase JS client */
  var ext      = file.name.split('.').pop().toLowerCase() || 'jpg';
  var fileName = Date.now() + '_' + Math.random().toString(36).slice(2,8) + '.' + ext;
  var mimeType = file.type || 'image/jpeg';

  /* Convert dataUrl to Blob for upload */
  try {
    var arr  = dataUrl.split(',');
    var mime = (arr[0].match(/:(.*?);/) || [])[1] || mimeType;
    var bstr = atob(arr[1]);
    var n    = bstr.length;
    var u8   = new Uint8Array(n);
    for (var i=0;i<n;i++) u8[i]=bstr.charCodeAt(i);
    var blob = new Blob([u8], {type:mime});

    db.storage.from('gallery').upload(fileName, blob, {
      contentType: mime, upsert: false
    }).then(function(res) {
      if (res.error) {
        console.warn('Storage upload failed, using base64 fallback:', res.error.message);
        callback(null, dataUrl); /* fallback to base64 */
        return;
      }
      /* Get the public URL */
      var urlRes = db.storage.from('gallery').getPublicUrl(fileName);
      var pubUrl = urlRes.data && urlRes.data.publicUrl;
      callback(pubUrl || null, pubUrl ? null : dataUrl);
    }).catch(function(e) {
      console.warn('Storage error, using base64:', e);
      callback(null, dataUrl);
    });
  } catch(e) {
    console.warn('Blob conversion failed, using base64:', e);
    callback(null, dataUrl);
  }
}
function initials(name) {

function el(id) { return document.getElementById(id); }

function render() {
  var app = el('app');

    if (view === 'public') {
      app.innerHTML = renderPublic();

      app.innerHTML = renderLogin();
    } else {

  } catch(e) {
    console.error('Render error:', e);
    app.innerHTML = '<div style="padding:40px;text-align:center;font-family:sans-serif;">'
      + '<h2 style="color:#e53e3e;margin-bottom:8px;">Something went wrong</h2>'

      + '<button onclick="loggedIn=false;view=\'public\';render()" style="padding:10px 20px;background:#000;color:#fff;border:none;border-radius:8px;cursor:pointer;">Reset</button>'
      + '</div>';
  }
}

function row(label, val) {
  return '<div style="display:flex;justify-content:space-between;padding:4px 0;">'
    + '<span style="color:var(--g600);">'+label+'</span>'
    + '<span style="font-weight:500;">'+val+'</span>'

}
function formField(type, id, label, value, placeholder, onInput) {
  return '<div>'
    + '<label style="display:block;font-size:.8rem;font-weight:600;color:var(--g700);margin-bottom:6px;">'+label+'</label>'
    + '<input type="'+type+'" id="'+id+'" value="'+value+'" placeholder="'+placeholder+'" oninput="'+onInput+'"'
    + ' style="width:100%;padding:11px 14px;border:1.5px solid var(--g300);border-radius:var(--radius);font-size:.95rem;transition:border-color .15s;"'
    + ' onfocus="this.style.borderColor=\'var(--p400)\'" onblur="this.style.borderColor=\'var(--g300)\'">'

}

/* --- GALLERY PAGE --- */
function renderGalleryPage() {
  var cats = ['all','gel','extensions','art','care','polish','removal','combo'];
  var tabs = cats.map(function(c){
    var active = galleryFilter===c;
    return '<button onclick="setFilter(\''+c+'\')" style="padding:8px 18px;border-radius:var(--radius-full);font-size:.875rem;font-weight:500;cursor:pointer;border:1px solid var(--g200);'

      + '">'+(c.charAt(0).toUpperCase()+c.slice(1))+'</button>';
  }).join('');

  var filtered = galleryFilter==='all' ? gallery : gallery.filter(function(g){ return g.service===galleryFilter; });
  var items = filtered.map(function(g){
    var _gsrc = gSrc(g);
    var inner = _gsrc
      ? (g.type==='video'
          ? '<video src="'+_gsrc+'" style="width:100%;height:100%;object-fit:cover;" preload="none"></video>'
          : '<img src="'+_gsrc+'" alt="'+g.fileName+'" style="width:100%;height:100%;object-fit:cover;" loading="lazy" decoding="async">')
      : '<div style="width:100%;height:100%;background:linear-gradient(135deg,var(--p100),var(--p300));"></div>';
    return '<div style="border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;box-shadow:var(--shadow-sm);aspect-ratio:1;transition:transform .2s,box-shadow .2s;" onclick="openGalleryItem('+g.id+')" onmouseover="this.style.transform=\'scale(1.03)\';this.style.boxShadow=\'var(--shadow-lg)\';" onmouseout="this.style.transform=\'none\';this.style.boxShadow=\'var(--shadow-sm)\';">'
      + '<div style="width:100%;height:100%;position:relative;">'
      + '<div style="position:relative;">'
      + inner
      + '<div style="position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.5);color:#fff;font-size:.7rem;padding:3px 8px;border-radius:var(--radius-full);">'+g.service+'</div>'
      + '</div>'
      + '</div>'
      + '</div>';
  }).join('');

  return '<section style="padding:64px 24px;background:linear-gradient(to bottom,var(--p50),#fff);min-height:60vh;">'

    + '<div style="text-align:center;margin-bottom:40px;">'

    + '<h1 style="font-family:\'Playfair Display\',serif;font-size:2.5rem;font-weight:600;margin-top:8px;">Nail Art Gallery</h1>'
    + '</div>'
    + '<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:36px;">'+tabs+'</div>'
    + (filtered.length ? '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;">'+items+'</div>' : '<p style="text-align:center;color:var(--g400);padding:48px;">No items in this category.</p>')

/* --- ADMIN PAGE CONTENTS --- */
function getAdminPageContent() {
  if (adminPage==='dashboard')  return renderDashboard();
  if (adminPage==='bookings')   return renderBookingsMgmt();
  if (adminPage==='staff')      return renderStaffMgmt();
  if (adminPage==='services')   return renderServicesMgmt();
  if (adminPage==='svcimages')  return renderServiceImages();
  if (adminPage==='gallery')    return renderGalleryMgmt();
  if (adminPage==='inventory')  return renderInventoryMgmt();
  if (adminPage==='analytics')  return renderAnalytics();
  if (adminPage==='settings')   return renderSalonSettings();
  return '';
}

function renderDashboard() {
  var completed = bookings.filter(function(b){ return b.status==='completed'; });
  var pending   = bookings.filter(function(b){ return b.status==='pending'; });
  var revenue   = completed.reduce(function(s,b){ return s+(b.fullPrice||0); },0);
  var deposits  = pending.reduce(function(s,b){ return s+((b.fullPrice||0)*0.5); },0);
  var lowStock  = inventory.filter(function(i){ return i.status===1 || i.status==='low' || (i.stock<=i.threshold && i.threshold>0); }).length;

  var stats = [
    {label:"Revenue",      val:kes(revenue),      bg:'#ECFDF5',color:'#059669',
     icon:'<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>'},
    {label:"Deposits Due", val:kes(deposits),      bg:'#EFF6FF',color:'#2563EB',
     icon:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>'},
    {label:"Bookings",     val:bookings.length,    bg:'#FFF7ED',color:'#EA580C',
     icon:'<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>'},
    {label:"Low Stock",    val:lowStock,            bg:'#FEF2F2',color:'#DC2626',
     icon:'<path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>'}
  ].map(function(s){
    return '<div class="adm-card">'
      + '<div class="adm-stat-icon" style="background:'+s.bg+';color:'+s.color+';">'
      + '<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">'+s.icon+'</svg>'
      + '</div>'
      + '<div class="adm-label">'+s.label+'</div>'
      + '<div class="adm-val">'+s.val+'</div>'
      + '</div>';
  }).join('');

  var recentRows = bookings.slice(0,5).map(function(b){
    var sc = STATUS_COLORS[b.status||'pending'] || 'background:var(--g100);color:var(--g700)';
    return '<tr>'
      + '<td class="adm-td" style="font-weight:600;">'+(b.client||'-')+'</td>'
      + '<td class="adm-td" style="color:var(--g500);max-width:90px;overflow:hidden;text-overflow:ellipsis;">'+(b.service||'-')+'</td>'
      + '<td class="adm-td"><span class="adm-badge" style="'+sc+'">'+(STATUS_LABELS[b.status]||'-')+'</span></td>'
      + '</tr>';
  }).join('');

  return '<div style="display:flex;flex-direction:column;gap:10px;padding-bottom:72px;" class="fade-in">'
    + '<div class="adm-grid-2">'+stats+'</div>'
    + '<div class="adm-section">'
    + '<div class="adm-row" style="border-bottom:1px solid #F0F0F0;">'
    + '<span style="font-size:.82rem;font-weight:700;">Recent Bookings</span>'
    + '<button onclick="setAdminPage(this.getAttribute(\'data-p\'))" data-p="bookings" style="font-size:.72rem;color:var(--p600);background:none;border:none;cursor:pointer;font-weight:600;">View All</button>'
    + '</div>'
    + '<div style="overflow-x:auto;">'
    + '<table style="width:100%;"><thead style="background:var(--g50);"><tr>'
    + ['Client','Service','Status'].map(function(h){ return '<th class="adm-th">'+h+'</th>'; }).join('')
    + '</tr></thead><tbody>'
    + (recentRows || '<tr><td colspan="3" style="padding:20px;text-align:center;color:var(--g400);font-size:.78rem;">No bookings yet</td></tr>')
    + '</tbody></table>'
    + '</div></div></div>';
}
function renderBookingsMgmt() {
  var rows = bookings.map(function(b){
    var sc = STATUS_COLORS[b.status||'pending'] || 'background:var(--g100);color:var(--g700)';
    var actions = '';
    if (b.status==='pending') {
      actions = '<button class="adm-btn-sm" onclick="updateStatus('+b.id+',\'approved\')" style="background:#DCFCE7;color:#15803D;">OK</button>'
              + '<button class="adm-btn-sm" onclick="updateStatus('+b.id+',\'cancelled\')" style="background:#FEE2E2;color:#991B1B;margin-left:4px;">X</button>';
    } else if (b.status==='approved') {
      actions = '<button class="adm-btn-sm" onclick="updateStatus('+b.id+',\'completed\')" style="background:#D1FAE5;color:#047857;">Done</button>'
              + '<button class="adm-btn-sm" onclick="updateStatus('+b.id+',\'no_show\')" style="background:#FEE2E2;color:#991B1B;margin-left:4px;">NS</button>';
    } else if (b.status==='deposit_paid') {
      actions = '<button class="adm-btn-sm" onclick="updateStatus('+b.id+',\'approved\')" style="background:#DCFCE7;color:#15803D;">OK</button>';
    } else {
      actions = '<span style="font-size:.7rem;color:var(--g300);">-</span>';
    }
    return '<tr style="border-bottom:1px solid #F5F5F5;">'
      + '<td class="adm-td" style="font-weight:600;">'+(b.client||'-')+'</td>'
      + '<td class="adm-td" style="color:var(--g500);">'+(b.service||'-')+'</td>'
      + '<td class="adm-td" style="color:var(--g500);">'+(b.date||'-')+'</td>'
      + '<td class="adm-td"><span class="adm-badge" style="'+sc+'">'+(STATUS_LABELS[b.status]||'-')+'</span></td>'
      + '<td class="adm-td">'+actions+'</td>'
      + '</tr>';
  }).join('');

  return '<div class="fade-in" style="padding-bottom:72px;">'
    + '<div class="adm-page-hdr"><div><div class="adm-page-title">Bookings</div><div class="adm-page-sub">'+bookings.length+' total</div></div></div>'
    + '<div class="adm-section"><div style="overflow-x:auto;">'
    + '<table style="width:100%;"><thead style="background:var(--g50);"><tr>'
    + ['Client','Service','Date','Status',''].map(function(h){ return '<th class="adm-th">'+h+'</th>'; }).join('')
    + '</tr></thead><tbody>'
    + (rows || '<tr><td colspan="5" style="padding:24px;text-align:center;color:var(--g400);font-size:.78rem;">No bookings yet.</td></tr>')
    + '</tbody></table></div></div></div>';
}
function actionBtn(bg, color) {

function renderInventoryMgmt() {
  var lowCount = inventory.filter(function(i){ return i.status===1 || i.status==='low' || (i.stock<=i.threshold && i.threshold>0); }).length;

  var rows = inventory.map(function(item){
    var isLow = item.status===1 || item.status==='low' || (item.stock<=item.threshold && item.threshold>0);
    var invImg = item.gallery_id ? gallery.find(function(g){return g.id==item.gallery_id;}) : null;
    var invThumb = invImg && invImg.fileData

      + '<div style="font-size:.7rem;color:var(--g400);margin-top:1px;">Threshold: '+(item.threshold||0)+'</div>'

function assignGalleryCategory(id, cat) {
  var g = gallery.find(function(x){ return x.id===id; });
  if (g) { g.service = cat; }
  if (db) {
    db.from('gallery').update({service:cat}).eq('id',id)
      .then(function(r){ if(r.error) console.error('Update category:',r.error); })
      .catch(function(e){ console.error(e); });
  }
}

function buildLogoIconPicker() {
  var keys = Object.keys(LOGO_ICONS);

  var tiles = keys.map(function(k) {
    var active = config.logo_key === k && !config.logo_data;
    var path   = LOGO_ICONS[k];
    var h = [];
    h.push('<div data-logokey="' + k + '" title="' + k + '" style="width:52px;height:52px;border-radius:10px;border:2px solid ' + (active ? 'var(--p500)' : 'var(--g200)') + ';display:flex;align-items:center;justify-content:center;cursor:pointer;background:' + (active ? 'var(--p50)' : '#fff') + ';transition:.15s;flex-shrink:0;">');
    h.push('<svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">' + path + '</svg>');
    h.push('</div>');
    return h.join('');
  }).join('');

  var uploadPreview = config.logo_data
    ? '<img src="' + config.logo_data + '" style="width:52px;height:52px;border-radius:10px;object-fit:cover;">'

  var revenue   = bookings.filter(function(b){ return b.status==='completed'; }).reduce(function(s,b){ return s+(b.fullPrice||0); },0);

  var stats = [
    {label:'Bookings',      val:total},
    {label:'Completed',     val:completed},
    {label:'Success Rate',  val:rate+'%'},
    {label:'Revenue',       val:kes(revenue)},

    {label:'Gallery Items', val:gallery.length},

function buildGalleryOptions(selectedId) {
  /* Legacy dropdown for inventory - kept for compatibility */
  var opts = '<option value="">No image</option>';
  gallery.filter(function(g){ return g.type==='image'; }).forEach(function(g){
    var sel = (selectedId && String(selectedId)===String(g.id)) ? ' selected' : '';
    opts += '<option value="' + g.id + '"' + sel + '>' + (g.fileName||'Image '+g.id) + '</option>';
  });
  return opts;
}

function buildImagePicker(inputId, selectedId) {
  var imgs = gallery.filter(function(g){ return g.type === 'image' && gSrc(g); });
  var noImg = !selectedId;
  var previewSrc = '';
  if (selectedId) {
    var sg = gallery.find(function(g){ return g.id == selectedId; });
    if (sg) previewSrc = sg.fileData || '';
  }

  /* Build using array to avoid nested quote escaping */
  var h = [];
  h.push('<input type="hidden" id="' + inputId + '" value="' + (selectedId || '') + '">');

  /* Preview box */
  h.push('<div id="' + inputId + '-preview" style="width:100%;height:100px;border-radius:10px;overflow:hidden;border:2px solid ' + (previewSrc ? 'var(--p500)' : 'var(--g200)') + ';margin-bottom:10px;display:flex;align-items:center;justify-content:center;background:var(--g50);">');
  if (previewSrc) {
    h.push('<img src="' + previewSrc + '" style="width:100%;height:100%;object-fit:cover;" loading="lazy">');
  } else {
    h.push('<div style="text-align:center;color:var(--g400);font-size:.75rem;">No image selected</div>');
  }
  h.push('</div>');

  if (imgs.length === 0) {
    h.push('<p style="font-size:.72rem;color:var(--g400);text-align:center;padding:6px;">No images yet. Upload via Gallery tab first.</p>');
    return h.join('');
  }

  /* Grid of thumbnails */
  h.push('<div id="' + inputId + '-grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:200px;overflow-y:auto;padding:2px;">');

  /* None tile */
  h.push('<div data-picker="' + inputId + '" data-imgid="" style="aspect-ratio:1;border-radius:6px;border:2px solid ' + (noImg ? 'var(--p500)' : 'var(--g200)') + ';display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--g50);font-size:.6rem;color:var(--g400);text-align:center;transition:.15s;">None</div>');

  imgs.forEach(function(g) {
    var active = selectedId && String(g.id) === String(selectedId);
    h.push('<div data-picker="' + inputId + '" data-imgid="' + g.id + '" data-src="' + (g.fileData ? g.fileData.substring(0, 30) : '') + '" style="aspect-ratio:1;border-radius:6px;border:2px solid ' + (active ? 'var(--p500)' : 'var(--g200)') + ';overflow:hidden;cursor:pointer;transition:.15s;"><img src="' + g.fileData + '" style="width:100%;height:100%;object-fit:cover;" loading="lazy"></div>');
  });

  h.push('</div>');
  return h.join('');
}

function selectServiceImage(inputId, imgId) {
  var inp = el(inputId);
  if (inp) inp.value = imgId || '';

  var preview = el(inputId + '-preview');
  if (preview) {
    if (!imgId) {
      preview.innerHTML = '<div style="text-align:center;color:var(--g400);font-size:.75rem;">No image selected</div>';
      preview.style.borderColor = 'var(--g200)';
    } else {
      var g = gallery.find(function(x){ return x.id == imgId; });
      if (g && gSrc(g)) {
        preview.innerHTML = '<img src="' + gSrc(g) + '" style="width:100%;height:100%;object-fit:cover;">';
        preview.style.borderColor = 'var(--p500)';
      }
    }
  }

  /* Update border highlights on all tiles */
  var grid = el(inputId + '-grid');
  if (grid) {
    grid.querySelectorAll('[data-picker]').forEach(function(tile) {
      tile.style.borderColor = (tile.getAttribute('data-imgid') === String(imgId || '')) ? 'var(--p500)' : 'var(--g200)';
    });
  }
}

/* =====================================================================
   EVENT BINDING (called after every render)
   ===================================================================== */
function bindEvents() {
  /* mobile menu button */
  var menuBtn = el('menuBtn');
  if (menuBtn) {
    menuBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      mobileMenu = !mobileMenu;
      render();
    });
  }

  /* login form */
  var loginForm = el('login-form');
  if (loginForm) {
    loginForm.addEventListener('submit', function(e) {
      e.preventDefault();
      doLogin_attempt();
    });
  }

  /* booking form */
  var bkForm = el('booking-form');
  if (bkForm) {
    bkForm.addEventListener('submit', function(e) {
      e.preventDefault();
      submitBooking();
    });
  }

  /* modal forms */
  var staffForm = el('modal-staff-form');
  if (staffForm) staffForm.addEventListener('submit', function(e){ e.preventDefault(); submitStaff(); });

  var svcForm = el('modal-service-form');
  if (svcForm) svcForm.addEventListener('submit', function(e){ e.preventDefault(); submitService(); });

  var mediaForm = el('modal-media-form');
  if (mediaForm) mediaForm.addEventListener('submit', function(e){ e.preventDefault(); submitMedia(); });

  var invForm = el('modal-inventory-form');
  if (invForm) invForm.addEventListener('submit', function(e){ e.preventDefault(); submitInventory(); });

  /* settings form */
  var settingsForm = el('settings-form');
  if (settingsForm) {
    settingsForm.addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = el('settings-save-btn');
      if (btn) { btn.disabled=true; btn.textContent='Saving...'; }
      config.salon_name = (el('cfg-name')  && el('cfg-name').value.trim())  || config.salon_name;
      config.tagline    = (el('cfg-tag')   && el('cfg-tag').value.trim())   || config.tagline;
      config.phone      = (el('cfg-phone') && el('cfg-phone').value.trim()) || config.phone;
      config.email      = (el('cfg-email') && el('cfg-email').value.trim()) || config.email;
      config.location   = (el('cfg-loc')   && el('cfg-loc').value.trim())   || config.location;
      /* logo_key and logo_data already live in config from selectLogoIcon / file upload */
      render(); /* update UI immediately */
      saveConfigToDB(function(ok) {
        if (btn) {
          btn.disabled = false;
          btn.textContent = ok ? 'Saved!' : 'Save Failed - Try Again';
          setTimeout(function(){ btn.textContent='Save Changes'; }, 2500);
        }
      });
    });
  }

  /* Unified click delegation: image pickers + logo picker */
  document.addEventListener('click', function(e) {
    var tile = e.target.closest('[data-picker]');
    if (tile) {
      selectServiceImage(tile.getAttribute('data-picker'), tile.getAttribute('data-imgid') || '');
      return;
    }
    var logoTile = e.target.closest('[data-logokey]');
    if (logoTile) { selectLogoIcon(logoTile.getAttribute('data-logokey')); return; }
    if (e.target.closest('[data-logoupload]')) {
      var inp = document.getElementById('logo-file-inp');
      if (inp) inp.click();
      return;
    }
    if (e.target.closest('[data-clearlogo]')) { clearLogoImage(); return; }
  });

  /* Logo file upload in settings */
  document.addEventListener('change', function(e) {
    if (e.target && e.target.id === 'logo-file-inp') {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      if (file.size > 2*1024*1024) { alert('Image too large. Max 2MB for logo.'); return; }
      var reader = new FileReader();
      reader.onload = function(evt) {
        config.logo_data = evt.target.result;
        config.logo_key  = '';
        render();
      };
      reader.readAsDataURL(file);
    }
  });

  /* file input label update */

/* =====================================================================
   LOGIN
   ===================================================================== */
function doLogin_attempt() {
  var emailEl = el('login-email');
  var passEl  = el('login-password');
  if (!emailEl || !passEl) { loginErr = 'Form error - please reload'; render(); return; }

  var email = emailEl.value.trim().toLowerCase();
  var pass  = passEl.value;
  if (!email || !pass) { loginErr = 'Please enter your email and password'; render(); return; }
  if (!db) { loginErr = 'No database connection. Check config.js'; render(); return; }

  loginErr = ''; loginLoading = true; render();

  /* Single auth path: Supabase Auth only - no credentials in client code */
  db.auth.signInWithPassword({ email: email, password: pass })
    .then(function(result) {
      loginLoading = false;
      if (result.error) {
        var msg = result.error.message || 'Incorrect email or password';
        /* Friendly message for unconfirmed email */
        if (msg.toLowerCase().indexOf('confirm') !== -1 || msg.toLowerCase().indexOf('not confirmed') !== -1) {
          msg = 'Email not confirmed. Go to Supabase -> Authentication -> Providers -> Email -> turn off Confirm email.';
        } else if (msg.toLowerCase().indexOf('invalid') !== -1 || msg.toLowerCase().indexOf('credentials') !== -1) {
          msg = 'Incorrect email or password.';
        }
        loginErr = msg; render();
      } else if (result.data && result.data.user) {
        var u = result.data.user;
        var name = (u.user_metadata && u.user_metadata.full_name) || u.email.split('@')[0] || 'Admin';
        finishLogin(name, 'Manager');
      } else {
        loginErr = 'Login failed. Try again.'; render();
      }
    })
    .catch(function(err) {
      loginLoading = false;
      loginErr = 'Connection error: ' + (err.message || 'Try again');
      render();
    });
}

function finishLogin(name, role) {
  loggedIn  = true; view = 'admin';
  adminName = name; adminRole = role;
  loginErr  = ''; loginLoading = false;
  /* Session is managed by Supabase SDK - no credentials stored in localStorage */
  render();
  if (db) loadAll();
}

function doLogout() {
  loggedIn = false; view = 'public';
  /* Keep data arrays in memory so public site doesn't flash empty */
  /* Only clear admin-sensitive data */
  staff     = [];
  inventory = [];
  /* Supabase SDK clears the session token automatically */
  if (db) db.auth.signOut().catch(function(){});
  render();
  syncSupabase(); /* re-sync public data quietly */
}

function loadAll() {
  if (!db) return;
  Promise.all([
    db.from('services').select('*'),
    db.from('bookings').select('*'),
    db.from('staff').select('*'),
    db.from('inventory').select('*'),
    db.from('gallery').select('*')
  ]).then(function(results) {
    var svcRes=results[0], bkRes=results[1], stRes=results[2], invRes=results[3], galRes=results[4];

    if (!svcRes.error  && svcRes.data  && svcRes.data.length  > 0) services  = svcRes.data;
    if (!stRes.error   && stRes.data   && stRes.data.length   > 0) staff     = stRes.data;
    if (!invRes.error  && invRes.data  && invRes.data.length  > 0) inventory = invRes.data;

    if (!bkRes.error && bkRes.data) {
      bookings = bkRes.data.map(function(b) {
        return {
          id:          b.id,
          client:      b.client_name  || b.client      || '',
          phone:       b.client_phone || b.phone        || '',
          service:     b.service_name || b.service      || '',
          fullPrice:   b.full_price   || b.fullPrice    || 0,
          depositPaid: b.deposit_paid || b.depositPaid  || 0,
          balance:     b.balance      || 0,
          date:        b.appointment_date || b.date || '',
          time:        b.appointment_time || b.time || '',
          status:      b.status       || 'pending'
        };
      });
    }

    if (!galRes.error && galRes.data && galRes.data.length > 0) {
      gallery = galRes.data.map(function(g) {
        return {
          id:         g.id,
          type:       (g.type===1||g.type==='1'||g.type==='video') ? 'video' : 'image',
          service:    g.service   || '',
          fileName:   g.file_name || g.fileName  || '',
          storageUrl: g.storage_url || g.storageUrl || null
        };
      });
    }

    render();
  }).catch(function(err) {
    console.error('loadAll error:', err);
  });
}

function submitBooking() {
  /* Read directly from DOM - avoids state loss when render() fires on service change */
  var nameVal  = (el('bk-name')    && el('bk-name').value.trim())    || bookingForm.name;
  var phoneVal = (el('bk-phone')   && el('bk-phone').value.trim())   || bookingForm.phone;
  var svcVal   = (el('bk-service') && el('bk-service').value)        || bookingForm.service;
  var dateVal  = (el('bk-date')    && el('bk-date').value)           || bookingForm.date;
  var timeVal  = (el('bk-time')    && el('bk-time').value)           || bookingForm.time;

  if (!nameVal || !phoneVal || !svcVal || !dateVal || !timeVal) {
    alert('Please fill in all fields (Name, Phone, Service, Date and Time)'); return;
  }
  var svc = services.find(function(s){ return s.id==svcVal || String(s.id)==String(svcVal); });
  if (!svc) { alert('Please select a valid service'); return; }

  /* Combine date + time into a proper timestamp for DB */
  var apptTimestamp = null;
  try {
    if (dateVal && timeVal) {
      apptTimestamp = new Date(dateVal + 'T' + timeVal + ':00').toISOString();
    }
  } catch(e) {}

  var record = {
    client_name:  nameVal,
    client_phone: phoneVal,
    service_name: svc.name,
    full_price:   svc.price,
    deposit_paid: 0,
    balance:      svc.price,
    appointment_date: dateVal,
    appointment_time: timeVal,
    appointment_at:   apptTimestamp,
    status:       'pending'
  };

  var localAdd = function(id) {
    bookings.push({ id:id||nextBkId++, client:record.client_name, phone:record.client_phone,
      service:record.service_name, fullPrice:record.full_price, depositPaid:0,
      balance:record.balance, date:record.appointment_date||'', time:record.appointment_time||'', status:'pending' });
    notifyWhatsApp(record.client_name, record.client_phone, svc.name, record.date, record.time, svc.price);
    bookingForm = { name:'',phone:'',service:'',date:'',time:'' }; saveCache();
    showModal=true; modalType='bookingConfirmation'; render();
  };

  if (db) {
    db.from('bookings').insert([record]).select()
      .then(function(r){
        if (r.error) {
          console.error('Booking insert error:', r.error);
          alert('Booking failed to save: ' + r.error.message + '\n\nPlease screenshot this and contact the salon directly at +254748956804');
        } else {
          localAdd(r.data && r.data[0] ? r.data[0].id : null);
        }
      })
      .catch(function(e){
        console.error('Booking insert catch:', e);
        alert('Connection error. Please try again or contact us on WhatsApp: +254748956804');
      });
  } else { localAdd(); }
}

function submitMedia() {
  var fileInput = el('media-file-input');
  var svcEl     = el('media-service');
  if (!fileInput || !fileInput.files || !fileInput.files[0]) { alert('Please select a file'); return; }
  if (!svcEl || !svcEl.value) { alert('Please select a service category'); return; }

  var file    = fileInput.files[0];
  var service = svcEl.value;
  var isImage = modalType === 'uploadImage';
  var maxSize = isImage ? 15*1024*1024 : 100*1024*1024;
  if (file.size > maxSize) { alert('File too large. Max ' + (isImage ? '15MB' : '100MB')); return; }

  var submitBtn = document.querySelector('#modal-media-form button[type="submit"]');
  function setBtn(txt, disabled) {
    if (submitBtn) { submitBtn.disabled = !!disabled; submitBtn.textContent = txt; }
  }
  setBtn('Uploading...', true);

  function saveRecord(storageUrl, fallbackBase64) {
    var record = {
      type:         isImage ? 'image' : 'video',
      service:      service,
      file_name:    file.name,
      storage_url:  storageUrl  || null,
      file_data:    storageUrl  ? null : fallbackBase64,  /* only store base64 if no CDN URL */
      created_at:   new Date().toISOString()
    };
    var localItem = {
      id: null, type: record.type, service: record.service,
      fileName: record.file_name,
      storageUrl: storageUrl || null
    };
    if (db) {
      db.from('gallery').insert([record]).select()
        .then(function(r) {
          if (r.error) { console.error('Gallery insert error:', r.error); alert('Save failed: ' + r.error.message); setBtn('Upload', false); return; }
          localItem.id = (r.data && r.data[0]) ? r.data[0].id : nextGalId++;
          gallery.push(localItem);
          closeModal();
        }).catch(function(e) { console.error(e); setBtn('Upload', false); });
    } else {
      localItem.id = nextGalId++;
      gallery.push(localItem);
      closeModal();
    }
  }

  if (isImage) {
    /* Compress image first, then try Storage upload */
    setBtn('Compressing...', true);
    compressImage(file, function(err, dataUrl) {
      setBtn('Uploading...', true);
      uploadToStorage(file, dataUrl, function(storageUrl, fallback) {
        saveRecord(storageUrl, fallback);
      });
    });
  } else {
    /* Video - read as base64 (Storage for video is a future upgrade) */
    var reader = new FileReader();
    reader.onload = function(evt) { saveRecord(null, evt.target.result); };
    reader.onerror = function() { alert('Could not read file'); setBtn('Upload', false); };
    reader.readAsDataURL(file);
  }
}

function saveCache() {
  if (!window.localStorage) return;
  try {
    localStorage.setItem('fidelis_data', JSON.stringify({
      services:  services,
      gallery:   gallery.map(function(g){ return {id:g.id,type:g.type,service:g.service,fileName:g.fileName,storageUrl:g.storageUrl||''}; }),
      bookings:  bookings.slice(0,100),
      staff:     staff,
      inventory: inventory
    }));
  } catch(e) { /* storage full or unavailable */ }
}

function loadCache() {
  if (!window.localStorage) return false;
  try {
    var cached = JSON.parse(localStorage.getItem('fidelis_data'));
    if (cached) {
      if (cached.services  && cached.services.length)  services  = cached.services;
      if (cached.gallery   && cached.gallery.length)   gallery   = cached.gallery.map(function(g){ return {id:g.id,type:g.type||'image',service:g.service||'',fileName:g.fileName||'',storageUrl:g.storageUrl||''}; });
      if (cached.bookings  && cached.bookings.length)  bookings  = cached.bookings;
      if (cached.staff     && cached.staff.length)     staff     = cached.staff;
      if (cached.inventory && cached.inventory.length) inventory = cached.inventory;
      return true;
    }
  } catch(e) {}
  return false;
}

function loadConfigFromDB(callback) {
  if (!db) { callback && callback(); return; }
  db.from('config').select('key, value').then(function(r) {
    if (!r.error && r.data && r.data.length > 0) {
      r.data.forEach(function(row) {
        if (row.key === 'salon_name') config.salon_name = row.value;
        if (row.key === 'tagline')    config.tagline    = row.value;
        if (row.key === 'phone')      config.phone      = row.value;
        if (row.key === 'email')      config.email      = row.value;
        if (row.key === 'location')   config.location   = row.value;
        if (row.key === 'logo_key')   config.logo_key   = row.value || 'heart';
        if (row.key === 'logo_data')  config.logo_data  = row.value || '';
      });
    }
    callback && callback();
  }).catch(function() { callback && callback(); });
}

function saveConfigToDB(callback) {
  if (!db) {
    callback && callback(false);
    return;
  }
  var rows = [
    { key: 'salon_name', value: config.salon_name },
    { key: 'tagline',    value: config.tagline },
    { key: 'phone',      value: config.phone },
    { key: 'email',      value: config.email },
    { key: 'location',   value: config.location },
    { key: 'logo_key',   value: config.logo_key  || 'heart' },
    { key: 'logo_data',  value: config.logo_data || '' }
  ];
  /* Upsert each row */
  Promise.all(rows.map(function(row) {
    return db.from('config').upsert(row, { onConflict: 'key' });
  })).then(function(results) {
    var anyError = results.find(function(r) { return r.error; });
    callback && callback(!anyError);
  }).catch(function() { callback && callback(false); });
}

document.addEventListener('DOMContentLoaded', function() {
  /* Show spinner instantly */
  var app = document.getElementById('app');
  if (app) {
    app.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;">'
      + '<div style="text-align:center;">'
      + '<div style="width:48px;height:48px;border:3px solid var(--p200);border-top-color:var(--p500);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 16px;"></div>'
      + '<p style="font-family:Urbanist,sans-serif;color:var(--g400);font-size:.875rem;">Loading Fidelis...</p>'
      + '</div></div>'
      + '<style>@keyframes spin{to{transform:rotate(360deg)}}</style>';
  }

  /* Load cache silently in background (no render yet) */
  loadCache();

  if (!db) {
    /* No Supabase - render with defaults immediately */
    render(); return;
  }

  /* Load config + check session in parallel, render exactly once when both done */
  Promise.all([
    loadConfigFromDB_promise(),
    db.auth.getSession()
  ]).then(function(results) {
    var sessionResult = results[1];
    if (sessionResult && sessionResult.data && sessionResult.data.session && sessionResult.data.session.user) {
      var u = sessionResult.data.session.user;
      loggedIn  = true;
      view      = 'admin';
      adminName = (u.user_metadata && u.user_metadata.full_name) || u.email.split('@')[0] || 'Admin';
      adminRole = 'Manager';
    }
    render(); /* single render after config + session both resolved */
    if (loggedIn) { loadAll(); } else { syncSupabase(); }
  }).catch(function() {
    render();
    syncSupabase();
  });
});

function loadConfigFromDB_promise() {
  return new Promise(function(resolve) {
    loadConfigFromDB(resolve);
  });
}

function syncSupabase() {
  if (!db) return;
  /* Always sync public data */
  var queries = [
    db.from('services').select('*'),
    db.from('gallery').select('*'),
    db.from('bookings').select('*').order('created_at', {ascending: false}).limit(100)
  ];
  /* Add admin-only data if logged in */
  if (loggedIn) {
    queries.push(db.from('staff').select('*'));
    queries.push(db.from('inventory').select('*'));
  }
  Promise.all(queries).then(function(results) {
    var changed = false;
    var svcRes = results[0];
    var galRes = results[1];
    var bkRes  = results[2];
    var stRes  = results[3];
    var invRes = results[4];

    if (!svcRes.error && svcRes.data) {
      services = svcRes.data; changed = true;
    }
    if (!galRes.error && galRes.data) {
      gallery = galRes.data.map(function(g) {
